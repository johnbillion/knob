name: Knob
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"

packages:
  PreviewScreenshots:
    url: https://github.com/johnbillion/swiftui-preview-screenshots
    from: "1.0.0"

targets:
  Knob:
    type: application
    platform: macOS
    sources:
      - Knob
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.Knob
        INFOPLIST_FILE: Knob/Info.plist
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "5.0"

  KnobTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - KnobTests
    dependencies:
      - target: Knob
      - package: PreviewScreenshots
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
